name: Publish both atlases

on:
  workflow_dispatch:

permissions:
  contents: read

# Shared with rollback; serialize the entire publication.
concurrency:
  group: github-pages-publication
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.refs.outputs.stable }}
      dev: ${{ steps.refs.outputs.dev }}
    steps:
      - name: Require the main coordinator
        run: test '${{ github.ref }}' = refs/heads/main
      - uses: actions/checkout@v4
      - name: Snapshot both branch heads
        id: refs
        run: |
          refs=$(git ls-remote --heads origin refs/heads/main refs/heads/dev)
          stable=$(echo "$refs" | awk '$2 == "refs/heads/main" {print $1}')
          dev=$(echo "$refs" | awk '$2 == "refs/heads/dev" {print $1}')
          test ${#stable} -eq 40
          test ${#dev} -eq 40
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "dev=$dev" >> "$GITHUB_OUTPUT"
  build:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            commit: ${{ needs.resolve.outputs.stable }}
            suffix: ''
          - channel: dev
            commit: ${{ needs.resolve.outputs.dev }}
            suffix: 'dev/'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/atlas/package-lock.json
      - name: Verify source channel
        env:
          EXPECTED_CHANNEL: ${{ matrix.channel }}
        run: python -c 'import json, os; assert json.load(open("atlas-source.json"))["channel"] == os.environ["EXPECTED_CHANNEL"]'
      - run: python -m unittest discover -s scripts/tests
      - run: npm ci && npm test && npm run lint && npx tsc --noEmit
        working-directory: web/atlas
      - name: Build pinned channel
        env:
          POLISHED_DIR: ${{ github.workspace }}/external/upstream
          VITE_PUBLIC_BASE: /${{ github.event.repository.name }}/${{ matrix.suffix }}
        run: python scripts/build_atlas.py --skip-install
      - name: Require complete upstream audit
        if: matrix.channel == 'dev'
        run: |
          git -C external/upstream fetch --unshallow origin
          head=$(python -c 'import json; print(json.load(open("atlas-source.json"))["commit"])')
          python scripts/audit_upstream.py --repo external/upstream --output docs/upstream-audit.json --head "$head" --check
      - uses: actions/upload-artifact@v4
        with:
          name: channel-${{ matrix.channel }}
          path: web/atlas/dist
          if-no-files-found: error
  assemble:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.stable }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: channel-stable
          path: .build/stable
      - uses: actions/download-artifact@v4
        with:
          name: channel-dev
          path: .build/dev
      - run: python scripts/assemble_pages.py --stable .build/stable --dev .build/dev --output .build/site
      - uses: actions/upload-artifact@v4
        with:
          name: combined-site
          path: .build/site
          include-hidden-files: true
          retention-days: 90
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build/site
  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v4
      - uses: actions/deploy-pages@v4
        id: deployment
