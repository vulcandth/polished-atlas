name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/atlas/package-lock.json
      - run: python -m unittest discover -s scripts/tests
      - run: npm ci
        working-directory: web/atlas
      - run: npm test && npm run lint && npx tsc --noEmit
        working-directory: web/atlas
      - name: Resolve channel
        id: channel
        run: |
          channel=$(python -c 'import json; print(json.load(open("atlas-source.json"))["channel"])')
          echo "name=$channel" >> "$GITHUB_OUTPUT"
          base="/${{ github.event.repository.name }}/"
          if [ "$channel" = dev ]; then base="${base}dev/"; fi
          echo "VITE_PUBLIC_BASE=$base" >> "$GITHUB_ENV"
      - run: python scripts/build_atlas.py --skip-install
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ steps.channel.outputs.name }}-${{ github.sha }}
          path: web/atlas/dist
          if-no-files-found: error
