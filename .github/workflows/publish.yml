name: Publish development atlas

on:
  workflow_dispatch:
    inputs:
      stable_run_id:
        description: Successful main publication containing the live channel-stable artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: github-pages-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require dev branch
        run: test "$GITHUB_REF" = refs/heads/dev
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/atlas/package-lock.json
      - name: Verify dev source
        run: python -c 'import json; assert json.load(open("atlas-source.json"))["channel"] == "dev"'
      - run: python -m unittest discover -s scripts/tests
      - run: npm ci && npm test && npm run lint && npx tsc --noEmit
        working-directory: web/atlas
      - name: Build pinned channel
        env:
          POLISHED_DIR: ${{ github.workspace }}/external/upstream
          VITE_PUBLIC_BASE: /${{ github.event.repository.name }}/dev/
        run: python scripts/build_atlas.py --skip-install
      - name: Require complete upstream audit
        run: |
          git -C external/upstream fetch --unshallow origin
          head=$(python -c 'import json; print(json.load(open("atlas-source.json"))["commit"])')
          python scripts/audit_upstream.py --repo external/upstream --output docs/upstream-audit.json --head "$head" --check
      - uses: actions/upload-artifact@v4
        with:
          name: channel-dev
          path: web/atlas/dist
          if-no-files-found: error
  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify stable artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_RUN: ${{ inputs.stable_run_id }}
        run: |
          [[ "$STABLE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STABLE_RUN" > .build-stable-run.json
          python -c 'import json; r=json.load(open(".build-stable-run.json")); assert (r["head_branch"], r["path"], r["conclusion"]) == ("main", ".github/workflows/publish.yml", "success")'
      - uses: actions/download-artifact@v4
        with:
          name: channel-stable
          path: .build/stable
          run-id: ${{ inputs.stable_run_id }}
          github-token: ${{ github.token }}
      - name: Match retained stable bundle to the live deployment
        run: |
          curl --fail --retry 3 "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/build-info.json?run=$GITHUB_RUN_ID" -o .build/live-stable.json
          cmp .build/live-stable.json .build/stable/build-info.json
      - uses: actions/download-artifact@v4
        with:
          name: channel-dev
          path: .build/dev
      - run: python scripts/assemble_pages.py --stable .build/stable --dev .build/dev --output .build/site
      - uses: actions/upload-artifact@v4
        with:
          name: combined-site
          path: .build/site
          include-hidden-files: true
          retention-days: 90
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build/site
  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v4
      - uses: actions/deploy-pages@v4
        id: deployment
